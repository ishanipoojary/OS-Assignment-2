body {
    font-family: Arial, sans-serif;
    background: #f3f6fa;
    color: #172033;
    padding: 20px;
}
h1, h2 { text-align: center; }
.table {
    position: relative;
    width: 340px;
    height: 340px;
    max-width: 85vw;
    max-height: 85vw;
    margin: 30px auto;
    border: 7px solid #a6b7c9;
    border-radius: 50%;
    background: #e4edf5;
}
.person, .fork {
    position: absolute;
    transform: translate(-50%, -50%);
    text-align: center;
    padding: 10px 4px;
    border-radius: 10px;
    font-size: 12px;
    box-shadow: 0 2px 6px #0002;
}
.person {
    width: 112px;
    background: white;
}
.fork {
    width: 78px;
    background: #fff0c2;
    border: 1px solid #d8b55d;
}
.p0 { left: 50%; top: 7%; }
.p1 { left: 93%; top: 50%; }
.p2 { left: 50%; top: 93%; }
.p3 { left: 7%; top: 50%; }
.f0 { left: 76%; top: 22%; }
.f1 { left: 76%; top: 78%; }
.f2 { left: 24%; top: 78%; }
.f3 { left: 24%; top: 22%; }
.panel {
    max-width: 850px;
    margin: 20px auto;
    padding: 16px;
    background: white;
    border-radius: 12px;
}
.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 12px;
}
button { padding: 9px 16px; cursor: pointer; }
input { width: 100%; }
#log {
    max-height: 250px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
}
.entry {
    padding: 7px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
}
.active { background: #dff4e5; }

    <p id="current"></p>

let index = 0;
let timer = null;

const slider = document.getElementById("timeline");
slider.max = events.length - 1;

function stop() {
    if (timer !== null) clearInterval(timer);
    timer = null;
    document.getElementById("play").textContent = "Play";
}

function render() {
    const e = events[index];

    for (let i = 0; i < 4; i++) {
        const state = e.states[i];
        const p = document.getElementById("p" + i);
        p.textContent = "P" + i + " · " + state;
        p.style.background = state === "Eating" ? "#c8f2d0" :
            state === "Hungry" ? "#ffe0bd" :
            state === "Finished" ? "#dbeafe" : "white";

        const owner = e.chopstick_owners[i];
        const f = document.getElementById("f" + i);
        f.textContent = owner === null ?
            "C" + i + " · Free" : "C" + i + " · P" + owner;
        f.style.background = owner === null ? "#fff0c2" : "#b8e3fa";
    }

    slider.value = index;
    document.getElementById("counter").textContent =
        "Event " + (index + 1) + " of " + events.length +
        " · Time " + e.time + " seconds";

    document.getElementById("current").textContent =
        "P" + e.philosopher + ": " + e.action +
        (e.detail ? " — " + e.detail : "");

    document.querySelectorAll(".entry").forEach((row, i) =>
        row.classList.toggle("active", i === index)
    );
    document.querySelector(".entry.active")?.scrollIntoView({
        block: "nearest"
    });
}

function moveTo(n) {
    index = Math.max(0, Math.min(events.length - 1, n));
    render();
}

document.getElementById("prev").onclick = () => {
    stop(); moveTo(index - 1);
};
document.getElementById("next").onclick = () => {
    stop(); moveTo(index + 1);
};
document.getElementById("reset").onclick = () => {
    stop(); moveTo(0);
};
document.getElementById("play").onclick = () => {
    if (timer !== null) {
        stop();
        return;
    }
    if (index === events.length - 1) moveTo(0);
    document.getElementById("play").textContent = "Pause";
    timer = setInterval(() => {
        if (index >= events.length - 1) {
            stop();
            return;
        }
        moveTo(index + 1);
    }, 500);
};
slider.oninput = () => {
    stop(); moveTo(Number(slider.value));
};

const log = document.getElementById("log");
events.forEach((e, i) => {
    const row = document.createElement("div");
    row.className = "entry";
    row.textContent = "#" + (i + 1) + " [" + e.time + "s] P" +
        e.philosopher + ": " + e.action +
        (e.detail ? " — " + e.detail : "");
    row.onclick = () => {
        stop(); moveTo(i);
    };
    log.appendChild(row);
});

render();
